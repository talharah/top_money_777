<!DOCTYPE html>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
    // Check if user is logged in
    const isLoggedIn = localStorage.getItem('isLoggedIn');
    
    if (isLoggedIn !== 'true') {
        // Logged in na thakle auto login page-e redirect korbe
        window.location.href = 'login.html';
    }
</script>
</head>

            <a href="refer.html" class="p-3.5 flex items-center justify-between hover:bg-slate-700/30 transition">

            <a href="#" class="p-3.5 flex items-center justify-between hover:bg-slate-700/30 transition">
