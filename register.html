<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Earning Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-white min-h-screen font-sans flex items-center justify-center p-4">

    <!-- Register Container -->
    <div class="w-full max-w-md bg-slate-800/90 border border-slate-700/60 rounded-3xl p-6 shadow-2xl space-y-5 my-6">
        
        <!-- Header Area -->
        <div class="text-center space-y-1.5">
            <div class="w-14 h-14 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 rounded-2xl flex items-center justify-center text-2xl mx-auto shadow-inner">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-100 tracking-wide">Create Account</h1>
            <p class="text-xs text-slate-400">নতুন অ্যাকাউন্ট তৈরি করতে সঠিক তথ্য দিন</p>
        </div>

        <!-- Signup Form -->
        <form onsubmit="handleRegister(event)" class="space-y-3.5">
            
            <!-- Full Name -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Full Name</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-xs">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="reg-name" placeholder="User Name" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl py-2.5 pl-10 pr-4 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <!-- Phone Number -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Phone Number</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-xs">
                        <i class="fa-solid fa-phone"></i>
                    </span>
                    <input type="tel" id="reg-phone" placeholder="01700000000" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl py-2.5 pl-10 pr-4 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <!-- Password Field -->
<div>
    <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
    <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-xs">
            <i class="fa-solid fa-lock"></i>
        </span>
        <input type="password" id="reg-password" placeholder="••••••••" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl py-2.5 pl-10 pr-10 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
        
        <!-- Toggle Eye Button for Password -->
        <button type="button" onclick="togglePassword('reg-password', 'reg-eye-icon-1')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-eye" id="reg-eye-icon-1"></i>
        </button>
    </div>
</div>

<!-- Confirm Password Field -->
<div>
    <label class="block text-xs font-semibold text-slate-300 mb-1">Confirm Password</label>
    <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-xs">
            <i class="fa-solid fa-shield-halved"></i>
        </span>
        <input type="password" id="reg-confirm-password" placeholder="••••••••" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl py-2.5 pl-10 pr-10 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
        
        <!-- Toggle Eye Button for Confirm Password -->
        <button type="button" onclick="togglePassword('reg-confirm-password', 'reg-eye-icon-2')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-eye" id="reg-eye-icon-2"></i>
        </button>
    </div>
</div>

            <!-- Referral Code (Optional / Dynamic) -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Referral Code (Optional)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-xs">
                        <i class="fa-solid fa-ticket"></i>
                    </span>
                    <input type="text" id="reg-ref-code" placeholder="Enter Code" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl py-2.5 pl-10 pr-4 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <!-- Terms Agreement -->
            <div class="flex items-center gap-2 text-[11px] text-slate-400 pt-1">
                <input type="checkbox" required class="rounded bg-slate-900 border-slate-700 text-emerald-600 focus:ring-0"> 
                <span>I agree to the <a href="#" class="text-emerald-400 underline">Terms & Conditions</a></span>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition text-xs tracking-wide shadow-lg shadow-emerald-600/30">
                Register Now
            </button>
        </form>

        <!-- Divider -->
        <div class="relative flex py-0.5 items-center">
            <div class="flex-grow border-t border-slate-700/60"></div>
            <span class="flex-shrink mx-3 text-[10px] text-slate-500 uppercase tracking-widest">OR</span>
            <div class="flex-grow border-t border-slate-700/60"></div>
        </div>

        <!-- Login Redirect Link -->
        <div class="text-center">
            <p class="text-xs text-slate-400">
                Already have an account? 
                <a href="login.html" class="text-emerald-400 font-bold hover:underline ml-1">Log In</a>
            </p>
        </div>

    </div>

    <!-- JavaScript & URL Ref Code Capture -->
    <script>
        // Automatic Refer Code detection from URL (?ref=TALHA123)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref');
            if (refCode) {
                document.getElementById('reg-ref-code').value = refCode;
            }
        };

        function handleRegister(event) {
            event.preventDefault();
            const pass1 = document.getElementById('reg-password').value;
            const pass2 = document.getElementById('reg-confirm-password').value;

            if (pass1 !== pass2) {
                alert('Passwords do not match!');
                return;
            }

            alert('Registration Successful! Please Login.');
            window.location.href = 'login.html';
        }
        function togglePassword(inputId, iconId) {
    const passwordInput = document.getElementById(inputId);
    const eyeIcon = document.getElementById(iconId);

    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
    } else {
        passwordInput.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
    }
}
    </script>
</body>
</html>
