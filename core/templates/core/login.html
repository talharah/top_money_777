<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Earning Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-white min-h-screen font-sans flex items-center justify-center p-4">

    <!-- Login Container -->
    <div class="w-full max-w-md bg-slate-800/90 border border-slate-700/60 rounded-3xl p-6 shadow-2xl space-y-6">
        
        <!-- Header / Logo Area -->
        <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-inner">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-100 tracking-wide">Welcome Back!</h1>
            <p class="text-xs text-slate-400">আপনার অ্যাকাউন্টে লগইন করতে তথ্য দিন</p>
        </div>

        <!-- Error Message Display (যদি থাকে) -->
        {% if error %}
        <div class="bg-red-500/20 border border-red-500/50 text-red-300 text-xs p-3 rounded-xl text-center">
            {{ error }}
        </div>
        {% endif %}

        <!-- Login Form -->
        <form method="post" action="{% url 'login' %}" class="space-y-4">
            {% csrf_token %}

            <!-- Phone / Username -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Phone Number / Account ID</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-xs">
                        <i class="fa-solid fa-phone"></i>
                    </span>
                    <input type="text" name="phone" id="login-phone" placeholder="01700000000" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                </div>
            </div>

            <!-- Password Field -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-xs">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" id="login-password" placeholder="••••••••" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl py-2.5 pl-10 pr-10 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                    
                    <!-- Toggle Eye Button for Password -->
                    <button type="button" onclick="togglePassword('login-password', 'login-eye-icon-1')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200">
                        <i class="fa-solid fa-eye" id="login-eye-icon-1"></i>
                    </button>
                </div>
            </div>

            <!-- Forgot Password Option -->
            <div class="flex items-center justify-between text-[11px]">
                <label class="flex items-center gap-2 text-slate-400 cursor-pointer">
                    <input type="checkbox" class="rounded bg-slate-900 border-slate-700 text-blue-600 focus:ring-0"> Remember me
                </label>
                <a href="{% url 'support' %}" class="text-blue-400 hover:underline">Forgot password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition text-xs tracking-wide shadow-lg shadow-blue-600/30">
                Log In
            </button>
        </form>

        <!-- Divider -->
        <div class="relative flex py-1 items-center">
            <div class="flex-grow border-t border-slate-700/60"></div>
            <span class="flex-shrink mx-3 text-[10px] text-slate-500 uppercase tracking-widest">OR</span>
            <div class="flex-grow border-t border-slate-700/60"></div>
        </div>

        <!-- Register Redirect Link -->
        <div class="text-center">
            <p class="text-xs text-slate-400">
                Don't have an account? 
                <a href="{% url 'register' %}" class="text-blue-400 font-bold hover:underline ml-1">Create Account</a>
            </p>
        </div>

    </div>

    <!-- JavaScript Handling -->
    <script>
        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(iconId);

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
