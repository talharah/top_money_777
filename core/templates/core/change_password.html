<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-white min-h-screen pb-24 font-sans">

    <!-- Top Navigation Header -->
    <div class="sticky top-0 bg-[#1e293b]/90 backdrop-blur-md border-b border-slate-700/50 px-4 py-3 flex items-center justify-between z-40">
        <div class="flex items-center gap-3">
            <a href="{% url 'profile' %}" class="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center text-slate-300 hover:text-white border border-slate-700">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="text-base font-bold text-slate-100 tracking-wide">Change Password</h1>
        </div>
        <div class="text-xs text-emerald-400 font-semibold bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">
            Security
        </div>
    </div>

    <!-- Main Container -->
    <div class="px-4 pt-5 max-w-md mx-auto space-y-4">

        <!-- Banner Card -->
        <div class="bg-gradient-to-r from-emerald-900/40 to-slate-900 border border-emerald-500/30 rounded-2xl p-4 flex items-center gap-4 shadow-lg">
            <div class="w-14 h-14 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-2xl font-bold">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div>
                <h2 class="text-sm font-bold text-white">Password & Security</h2>
                <p class="text-xs text-slate-400 mt-0.5">আপনার অ্যাকাউন্টের পাসওয়ার্ড পরিবর্তন করুন</p>
            </div>
        </div>

        {% if form.errors %}
        <div class="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs p-3.5 rounded-2xl space-y-1">
            <p class="font-bold"><i class="fa-solid fa-circle-exclamation"></i> Error:</p>
            <p>বর্তমান পাসওয়ার্ড সঠিক নয় অথবা নতুন পাসওয়ার্ড দুটি মিলছে না। দয়া করে আবার চেষ্টা করুন।</p>
        </div>
        {% endif %}

        <!-- Change Password Form -->
        <form method="POST" class="bg-slate-800/90 border border-slate-700/60 rounded-2xl p-5 space-y-4 shadow-lg">
            {% csrf_token %}
            
            <!-- Old Password -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 px-1">Current Password</label>
                <div class="relative">
                    <span class="absolute left-3.5 top-3.5 text-slate-500 text-sm"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="old_password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <!-- New Password 1 -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 px-1">New Password</label>
                <div class="relative">
                    <span class="absolute left-3.5 top-3.5 text-slate-500 text-sm"><i class="fa-solid fa-key"></i></span>
                    <input type="password" name="new_password1" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <!-- New Password 2 (Confirm) -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 px-1">Confirm New Password</label>
                <div class="relative">
                    <span class="absolute left-3.5 top-3.5 text-slate-500 text-sm"><i class="fa-solid fa-key"></i></span>
                    <input type="password" name="new_password2" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-500/20 transition text-xs tracking-wide mt-2">
                Update Password
            </button>
        </form>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-[#1e293b]/95 backdrop-blur-md border-t border-slate-700/60 flex justify-around items-center py-2.5 px-6 z-50">
        <a href="{% url 'index' %}" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-medium">Home</span>
        </a>
        <a href="{% url 'tasks' %}" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-list-check text-lg"></i>
            <span class="text-[10px] font-medium">Task</span>
        </a>
        <a href="{% url 'plans' %}" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-gem text-lg"></i>
            <span class="text-[10px] font-medium">VIP</span>
        </a>
        <a href="{% url 'profile' %}" class="flex flex-col items-center gap-0.5 text-blue-400">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px] font-medium">Profile</span>
        </a>
    </div>

</body>
</html>
