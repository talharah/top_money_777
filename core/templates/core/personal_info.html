<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Information</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-white min-h-screen pb-24 font-sans">

    <!-- Top Navigation Header -->
    <div class="sticky top-0 bg-[#1e293b]/90 backdrop-blur-md border-b border-slate-700/50 px-4 py-3 flex items-center justify-between z-40">
        <div class="flex items-center gap-3">
            <a href="{% url 'profile' %}" class="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center text-slate-300 hover:text-white border border-slate-700">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="text-base font-bold text-slate-100 tracking-wide">Personal Information</h1>
        </div>
        <div class="text-xs text-blue-400 font-semibold bg-blue-500/10 px-2.5 py-1 rounded-full border border-blue-500/20">
            Profile Edit
        </div>
    </div>

    <!-- Main Container -->
    <div class="px-4 pt-5 max-w-md mx-auto space-y-4">

        <!-- Info Avatar Banner -->
        <div class="bg-gradient-to-r from-blue-900/40 to-slate-900 border border-blue-500/30 rounded-2xl p-4 flex items-center gap-4 shadow-lg">
            <div class="w-14 h-14 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30 flex items-center justify-center text-2xl font-bold">
                <i class="fa-solid fa-id-card"></i>
            </div>
            <div>
                <h2 class="text-sm font-bold text-white">Profile Details</h2>
                <p class="text-xs text-slate-400 mt-0.5">আপনার ব্যক্তিগত তথ্য দেখুন এবং আপডেট করুন</p>
            </div>
        </div>

        <!-- Personal Info Form -->
        <form method="POST" class="bg-slate-800/90 border border-slate-700/60 rounded-2xl p-5 space-y-4 shadow-lg">
            {% csrf_token %}
            
            <!-- Full Name -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 px-1">Full Name</label>
                <div class="relative">
                    <span class="absolute left-3.5 top-3.5 text-slate-500 text-sm"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="full_name" value="{{ request.user.first_name }}" placeholder="Enter your full name" required class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition">
                </div>
            </div>

            <!-- Phone Number / Account Username (Readonly) -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 px-1">Account Phone Number</label>
                <div class="relative">
                    <span class="absolute left-3.5 top-3.5 text-slate-500 text-sm"><i class="fa-solid fa-phone"></i></span>
                    <input type="text" value="{{ request.user.username }}" disabled class="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-400 cursor-not-allowed">
                    <span class="absolute right-3.5 top-3.5 text-xs text-slate-500 font-medium"><i class="fa-solid fa-lock text-[10px]"></i> Non-editable</span>
                </div>
            </div>

            <!-- Email Address (Optional Display) -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 px-1">Email Address</label>
                <div class="relative">
                    <span class="absolute left-3.5 top-3.5 text-slate-500 text-sm"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" name="email" value="{{ request.user.email }}" placeholder="e.g. user@example.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition">
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-500/20 transition text-xs tracking-wide mt-2">
                Save & Update Info
            </button>
        </form>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-[#1e293b]/95 backdrop-blur-md border-t border-slate-700/60 flex justify-around items-center py-2.5 px-6 z-50">
        <a href="{% url 'index' %}" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-medium">Home</span>
        </a>
        <a href="{% url 'tasks' %}" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-list-check text-lg"></i>
            <span class="text-[10px] font-medium">Task</span>
        </a>
        <a href="{% url 'plans' %}" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-gem text-lg"></i>
            <span class="text-[10px] font-medium">VIP</span>
        </a>
        <a href="{% url 'profile' %}" class="flex flex-col items-center gap-0.5 text-blue-400">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px] font-medium">Profile</span>
        </a>
    </div>

</body>
</html>
